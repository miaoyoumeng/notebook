kind: Service
apiVersion: v1
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ $.Values.apollo.name }}-apollo-meta-server
  labels:
    app: {{ $.Values.apollo.name }}-apollo-meta-server
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: {{ $.Values.apollo.name }}-apollo-meta-server
  type: ClusterIP
  clusterIP: None
  sessionAffinity: ClientIP