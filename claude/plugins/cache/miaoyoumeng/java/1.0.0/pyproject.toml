[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdd-java"
version = "1.0.0"
description = "Java TDD unit test skill - JUnit 5 + Mockito + Spring Boot Test"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "typing-extensions>=4.0",
]

[project.scripts]
test_generator = "test_generator:main"
coverage_analyzer = "coverage_analyzer:main"
tdd_workflow = "tdd_workflow:main"
fixture_generator = "fixture_generator:main"
