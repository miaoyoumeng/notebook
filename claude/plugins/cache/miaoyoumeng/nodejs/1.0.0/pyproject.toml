[project]
name = "tdd-typescript"
version = "1.0.0"
description = "TypeScript TDD 单元测试 skill 脚本工具"
requires-python = ">=3.10"

[project.scripts]
test-generator = "scripts.test_generator:main"
coverage-analyzer = "scripts.coverage_analyzer:main"
tdd-workflow = "scripts.tdd_workflow:main"
fixture-generator = "scripts.fixture_generator:main"

[project.dependencies]
typer = ">=0.9"
rich = ">=13.0"
typing-extensions = ">=4.0"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]
