kind: ConfigMap
apiVersion: v1
metadata:
  namespace: {{ $.Release.Namespace }}
  name: {{ $.Values.apollo.name }}-apollo-config-server-configmap
data:
  application.properties: |
    spring.datasource.url = jdbc:mysql://${MYSQL_SVC}:3306/ApolloConfigDB?characterEncoding=utf8
    spring.datasource.username = ${MYSQL_USER:root}
    spring.datasource.password = ${MYSQL_PWD}
    eureka.service.url = ${EUREKA_CLUSTER_URL}