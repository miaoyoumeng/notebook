
# k8s 配置

k8s:
  ## 存储
  # storage_class_name: nfs-client
  storage_class_name: yrcloudfile-sc
  # 外部访问节点地址，nodePort方式使用
  node_id: 172.16.113.30


# 指定对应组件的镜像地址
hub:
  repository: docker.io
  images:
    busybox: busybox:1.36.0
    redis_server: redis:5.0.14-alpine

redis:
  name: miao-you-meng
# 指定redis对外服务端口
service:
  ha_proxy_port: 32108
  redis_server_port: 32336
